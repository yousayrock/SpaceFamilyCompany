<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>LINEリッチメニュー（2500×1686）</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700;900&amp;family=M+PLUS+1:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
/* LINEリッチメニューの画像の元データ。2500×1686のJPEGに書き出す。
   考え方：研究所のガジェットの操作盤。紺の盤の上にキーが並び、左上に研究所の銘板がねじ留めされている。
   ボタンの決まり：LINEでメッセージを送るキーは丸い帯（.chip）、ページを開くキーは右上の矢印の丸（.arrow）。
   タップ領域は line/richmenu.json の areas と一致させること（キーの間の溝は、隣り合うキーで半分ずつ分ける）。 */
:root{--board:#1C1A33;--key:#2C2858;--key-line:#4A4480;--ink:#232046;--ink-deep:#1C1A33;--paper:#F7F5FB;--cyan:#A9DDE2;--pink:#F0A9B9;--muted:#C9C4E6;--pink-text:#4A2530;--cyan-text:#1F3F44}
*{box-sizing:border-box;margin:0}
html,body{width:2500px;height:1686px;overflow:hidden;background:var(--board)}
body{font-family:'M PLUS 1',sans-serif;color:var(--paper)}
.board{display:grid;grid-template-columns:1010px 689px 689px;grid-template-rows:801px 801px;gap:28px;padding:28px;width:2500px;height:1686px}
.key{border-radius:36px;position:relative;overflow:hidden}

/* 左：相談と研究員募集 */
.left{grid-row:1/3;display:flex;flex-direction:column;gap:28px}
.consult{height:1120px;background:var(--pink);color:var(--ink-deep);padding:72px 80px;display:flex;flex-direction:column;justify-content:space-between}
.recruit{flex:1;background:var(--cyan);color:var(--ink-deep);padding:56px 80px;display:flex;flex-direction:column;justify-content:center;gap:34px}

/* 銘板：この操作盤でいちばん目立たせる一か所 */
.plate{align-self:flex-start;position:relative;border:6px solid var(--ink-deep);border-radius:14px;padding:30px 72px 32px;background:#F6C3CE}
.plate b{display:block;font-family:'Noto Serif JP',serif;font-weight:900;font-size:68px;line-height:1.2;letter-spacing:.08em;white-space:nowrap}
.screw{position:absolute;width:22px;height:22px;border-radius:50%;background:var(--ink-deep)}
.screw::after{content:"";position:absolute;left:4px;right:4px;top:10px;height:2px;background:#F6C3CE;transform:rotate(-35deg)}
.screw.tl{left:14px;top:14px}.screw.tr{right:14px;top:14px}.screw.bl{left:14px;bottom:14px}.screw.br{right:14px;bottom:14px}

.consult h1{font-family:'Noto Serif JP',serif;font-weight:900;font-size:150px;line-height:1.2;letter-spacing:.02em}
.consult p{font-size:56px;font-weight:700;line-height:1.55;white-space:nowrap;color:var(--pink-text)}
.recruit h2{font-family:'Noto Serif JP',serif;font-weight:900;font-size:104px;line-height:1.15;white-space:nowrap}

.chip{display:inline-flex;align-items:center;gap:26px;align-self:flex-start;background:var(--ink-deep);color:var(--paper);border-radius:999px;padding:30px 60px;font-size:62px;font-weight:700}
.chip svg{width:64px;height:64px}

/* 右：ページを開く4つのキー */
.nav{background:var(--key);border:3px solid var(--key-line);padding:72px 70px 70px;display:flex;flex-direction:column;justify-content:space-between}
.nav .icon{width:170px;height:170px}
.nav b{display:block;font-family:'Noto Serif JP',serif;font-weight:900;font-size:124px;line-height:1.2;white-space:nowrap}
.nav small{display:block;font-size:52px;font-weight:500;color:var(--muted);margin-top:18px;white-space:nowrap}
.arrow{position:absolute;right:66px;top:76px;width:88px;height:88px;border-radius:50%;border:5px solid var(--key-line);display:flex;align-items:center;justify-content:center}
.arrow svg{width:42px;height:42px}
</style>
</head>
<body>
<div class="board">

<div class="left">
<div class="key consult">
<div class="plate"><i class="screw tl"></i><i class="screw tr"></i><i class="screw bl"></i><i class="screw br"></i><b>未来ガジェット研究所</b></div>
<h1>LINEで<br>相談する</h1>
<p>困りごとを一言どうぞ。<br>相談・見積もりは無料。</p>
<span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>ここを押して送信</span>
</div>
<div class="key recruit">
<h2>研究員、大募集！</h2>
<span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>ここを押して応募</span>
</div>
</div>

<div class="key nav">
<svg class="icon" viewBox="0 0 48 48" fill="none" stroke="#A9DDE2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="19"/><path d="M16 13l8 11 8-11M24 24v12M17 26h14M17 31h14"/></svg>
<span class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="#F7F5FB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span>
<div><b>料金</b><small>目安の金額</small></div>
</div>

<div class="key nav">
<svg class="icon" viewBox="0 0 48 48"><polygon points="24,3 8,24 24,24" fill="#A9DDE2"/><polygon points="24,3 40,24 24,24" fill="#F0A9B9"/><polygon points="8,24 24,45 24,24" fill="#F0A9B9"/><polygon points="40,24 24,45 24,24" fill="#A9DDE2"/></svg>
<span class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="#F7F5FB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span>
<div><b>発明品</b><small>つくった道具</small></div>
</div>

<div class="key nav">
<svg class="icon" viewBox="0 0 48 48" fill="none" stroke="#F0A9B9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h24v20H4zM28 19h8l7 7v6H28z"/><circle cx="12" cy="35" r="4"/><circle cx="35" cy="35" r="4"/></svg>
<span class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="#F7F5FB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span>
<div><b>導入事例</b><small>運送会社の連絡網</small></div>
</div>

<div class="key nav">
<svg class="icon" viewBox="0 0 48 48" fill="none" stroke="#A9DDE2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="16" r="8"/><path d="M8 43c1.5-9 8-14 16-14s14.5 5 16 14"/></svg>
<span class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="#F7F5FB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span>
<div><b>所長紹介</b><small>白キジ猫トムと旅する</small></div>
</div>

</div>
</body>
</html>
